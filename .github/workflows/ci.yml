name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # Ensure git is available (Gacils python:3.12-slim images may not have it)
          if ! command -v git > /dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends git
          fi
          # Restore .git directory (Gacils excludes it from workspace copy)
          if [ -d /tmp/gacils/.git ] && [ ! -d /github/workspace/.git ]; then
            cp -r /tmp/gacils/.git /github/workspace/.git
          fi
          pip install -e ".[dev,server]"

      - name: Install Playwright Chromium & dependencies
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --run-integration

  docker:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Docker host
        run: |
          # Ensure curl is available (Gacils containers may not have it)
          if ! command -v curl > /dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq curl > /dev/null 2>&1
          fi
          if [ ! -S /var/run/docker.sock ]; then
            echo "DOCKER_HOST=tcp://host.docker.internal:2375" >> "$GITHUB_ENV"
            echo "DOCKER_CHECK_HOST=host.docker.internal" >> "$GITHUB_ENV"
            echo "Running under Gacils (local Docker simulator) — using Docker proxy"
          else
            echo "DOCKER_HOST=unix:///var/run/docker.sock" >> "$GITHUB_ENV"
            echo "DOCKER_CHECK_HOST=localhost" >> "$GITHUB_ENV"
          fi

      - name: Build Docker image
        run: |
          docker build -t agentcrawl:test .

      - name: Run container
        run: |
          docker run -d --name agentcrawl-container -p 8000:8000 agentcrawl:test

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -s -f http://${DOCKER_CHECK_HOST:-localhost}:8000/health; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Waiting for /health..."
            sleep 1
          done
          echo "Health check failed!"
          docker logs agentcrawl-container
          exit 1

      - name: Shutdown container
        if: always()
        run: |
          docker stop agentcrawl-container || true
          docker rm agentcrawl-container || true

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ruff
        run: |
          pip install ruff

      - name: Run Ruff check
        run: |
          ruff check agentcrawl/ server/ tests/

      - name: Run Ruff format check
        run: |
          ruff format --check agentcrawl/ server/ tests/