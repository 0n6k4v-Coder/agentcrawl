name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev,server]"

      - name: Install Playwright Chromium & dependencies
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --run-integration

  docker:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t agentcrawl:test .

      - name: Run container
        run: |
          docker run -d --name agentcrawl-container -p 8000:8000 agentcrawl:test

      - name: Health check
        run: |
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/health; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Waiting for /health..."
            sleep 1
          done
          echo "Health check failed!"
          docker logs agentcrawl-container
          exit 1

      - name: Shutdown container
        if: always()
        run: |
          docker stop agentcrawl-container || true
          docker rm agentcrawl-container || true

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ruff
        run: |
          pip install ruff

      - name: Run Ruff check
        run: |
          ruff check agentcrawl/ server/ tests/

      - name: Run Ruff format check
        run: |
          ruff format --check agentcrawl/ server/ tests/